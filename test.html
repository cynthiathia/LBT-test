<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LBT 언어유형 테스트</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
  <script src="assets/js/theme.js?v=5"></script>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" title="테마 전환">☀</button>

  <!-- 로딩 -->
  <div id="loading" class="loading-wrap">
    <div class="loading-dot"></div>
  </div>

  <!-- 테스트 화면 -->
  <div id="test-screen" class="test-page" style="display:none">

    <!-- 진행 바 -->
    <div class="progress-header">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-info">
        <span class="progress-category" id="progress-category"></span>
        <span class="progress-count" id="progress-count"></span>
      </div>
    </div>

    <!-- 질문 -->
    <div class="test-body">
      <div class="question-number" id="question-number"></div>
      <h2 class="question-text" id="question-text"></h2>

      <div class="options-wrap">
        <button class="option-btn" id="option-a">
          <span class="option-label">A</span>
          <span class="option-text" id="option-a-text"></span>
        </button>
        <button class="option-btn" id="option-b">
          <span class="option-label">B</span>
          <span class="option-text" id="option-b-text"></span>
        </button>
        <button class="option-btn" id="option-c">
          <span class="option-label">C</span>
          <span class="option-text" id="option-c-text"></span>
        </button>
        <button class="option-btn" id="option-d">
          <span class="option-label">D</span>
          <span class="option-text" id="option-d-text"></span>
        </button>
      </div>
    </div>

    <!-- 이전 버튼 -->
    <div class="test-nav">
      <button class="btn-back" id="btn-back">← 이전</button>
      <span></span>
    </div>

  </div>

  <script src="assets/js/test.js?v=6"></script>
</body>
</html>
